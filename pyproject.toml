[project]
name = "atcoder-py"
version = "1.0.0"
description = "AtCoder Python workspace"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.12.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
